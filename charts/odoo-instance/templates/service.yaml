apiVersion: v1
kind: Service
metadata:
  name: {{ include "odoo-instance.fullname" . }}-odoo
  labels:
    {{- include "odoo-instance.labels" . | nindent 4 }}
    app.kubernetes.io/component: odoo
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    - name: longpolling
      port: {{ .Values.service.longpollingPort }}
      targetPort: longpolling
  selector:
    {{- include "odoo-instance.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: odoo
