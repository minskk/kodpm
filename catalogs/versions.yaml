# Odoo Community major versions and the runtime they need.
# Images are official Docker Hub tags unless a platform override is set.

"10.0":
  python: "2.7"
  postgres: "10"
  distro: "debian"
  distro_version: "9"
  image: "odoo:10"
  bin: odoo
  conf_path: /etc/odoo/odoo.conf
  data_dir: /var/lib/odoo
  extra_addons: /mnt/extra-addons
  http_option: xmlrpc_port
  longpolling_option: longpolling_port
  probes:
    type: tcp
  notes: "Python 2.7. Official image odoo:10."

